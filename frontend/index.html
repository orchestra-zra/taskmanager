<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/mainlogo.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, shrink-to-fit=no, viewport-fit=cover">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <title>PlanJet</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="wrap">
        <div id="root"></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function() {
        try {
          var tg = window.Telegram && window.Telegram.WebApp;
          var platform = (tg && tg.platform) || '';
          if (['macos', 'tdesktop', 'weba', 'web', 'webk'].includes(platform)) {
            return;
          }
          if (tg && typeof tg.expand === 'function') {
            tg.expand();
          }
          document.body.classList.add('mobile-body');
          var wrap = document.getElementById('wrap');
          if (wrap) wrap.classList.add('mobile-wrap');  
          var root = document.getElementById('root');
          if (root) root.classList.add('mobile-content');
        } catch (e) {
          console.warn('Telegram init error:', e);
        }
      })();
    </script>
  </body>
</html>
