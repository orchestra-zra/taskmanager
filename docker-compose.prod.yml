services:
  postgres:
    ports: !override
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"

  backend:
    ports: !override
      - "127.0.0.1:${BACKEND_HOST_PORT:-8001}:8000"

  frontend:
    ports: !override
      - "${FRONTEND_PORT:-3000}:80"

  caddy:
    profiles: ["caddy"]
    image: caddy:2.8-alpine
    container_name: planjet-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:-localhost}

volumes:
  caddy_data:
  caddy_config:
