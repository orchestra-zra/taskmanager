services:
  caddy:
    image: caddy:2.8-alpine
    container_name: planjet-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in root .env before starting production HTTPS proxy}

volumes:
  caddy_data:
  caddy_config:
